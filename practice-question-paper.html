<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADD QUESTION PAPER 2</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/practice-question-paper.css"></head><body><header class="topbar"><a href="index.html" class="icon-btn">←</a><div class="brand">ADD QUESTION PAPER 2</div><div class="top-actions"><button class="icon-btn" id="themeBtn">☾</button><a href="profile.html" class="avatar">AK</a></div></header><main class="editor-wrap"><section class="create-banner"><div><p class="eyebrow">PRACTICE QUESTION PAPER</p><h1>Question Paper 2</h1><p>Practice section-এর আলাদা question bank। Computer Room-এর প্রশ্নের সঙ্গে এটি কখনও মিশবে না। সর্বোচ্চ ২০টি প্রশ্ন।</p></div><div class="banner-art">📚</div></section><section class="selection-panel card"><div class="field"><label>Class</label><select id="editorClass"><option value="class5">Class 5</option><option value="class6">Class 6</option><option value="class7">Class 7</option><option value="class8">Class 8</option><option value="class9">Class 9</option><option value="class10">Class 10</option><option value="class11-science">Class 11 Science</option><option value="class12-science">Class 12 Science</option><option value="class11-commerce">Class 11 Commerce</option><option value="class12-commerce">Class 12 Commerce</option><option value="class11-arts">Class 11 Arts</option><option value="class12-arts">Class 12 Arts</option></select></div><div class="field"><label>Semester</label><select id="editorSemester"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></div><div class="field"><label>Subject</label><select id="editorSubject"></select></div></section><section class="editor-toolbar card"><div><p class="eyebrow">QUESTION BANK 2</p><h2 id="subjectTitle">Bengali</h2><p class="muted" id="questionCount">0 / 20 Questions</p></div><button id="addQuestion" class="primary">＋ Add Question</button></section><section id="questionList" class="question-list"></section><div class="bottom-actions"><button id="savePaper" class="save-btn">SAVE</button><a href="index.html" class="outline">Back to Home</a><span id="saveMsg" class="success-text"></span></div></main><div id="editorModal" class="modal hidden"><div class="modal-card question-modal"><button id="closeEditor" class="close">×</button><p class="eyebrow" id="modalEyebrow">QUESTION 1</p><h2>Edit Question</h2><div class="form-grid"><div class="field"><label>Question Type</label><select id="qType"><option value="mcq">MCQ</option><option value="short">Short Answer</option><option value="true_false">True / False</option><option value="fill_blank">Fill in the Blank</option><option value="paragraph">Paragraph</option><option value="essay">Essay</option></select></div><div class="field"><label>Marks</label><input id="qMarks" type="number" min="1" max="20" value="1"></div><div class="field full"><label>Question *</label><textarea id="qText" rows="4" maxlength="1000"></textarea></div></div><div id="qExtra"></div><div class="modal-actions"><button id="cancelEditor" class="outline">Cancel</button><button id="saveEditor" class="primary">Save Question</button></div><p id="editorError" class="danger"></p></div></div><script src="js/app.js"></script><script src="js/practice-question-paper.js"></script>
